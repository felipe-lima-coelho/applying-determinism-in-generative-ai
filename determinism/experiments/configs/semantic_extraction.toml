# Configuração versionada deste experimento; credenciais ficam no ambiente/.env.
provider = "openai"
model = "gpt-6-luna"
base_url = "https://api.openai.com/v1"
max_concurrency = 4
# Falha sem salvar se a cobertura mínima de duas referências ainda não foi atingida.
max_generations_per_segment = 20
temperature = 0.0
seed = 42
# 'none' permite temperature explícita no modelo padrão.
# Para um servidor local que não aceite o campo, selecione 'omit' explicitamente.
reasoning_effort = "none"
timeout_seconds = 60.0
max_completion_tokens = 4096
api_key_env = "OPENAI_API_KEY"
